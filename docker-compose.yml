version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: milano_postgres
    environment:
      POSTGRES_USER: milano_user
      POSTGRES_PASSWORD: milano_secure_password123
      POSTGRES_DB: milano_pizza_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - milano_network

volumes:
  postgres_data:

networks:
  milano_network:
    driver: bridge