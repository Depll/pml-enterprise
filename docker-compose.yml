version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: milano_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - milano_network

volumes:
  postgres_data:

networks:
  milano_network:
    driver: bridge