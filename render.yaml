services:
  # 1. NESTJS BACKEND
  - type: web
    name: milano-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: milano-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: milano-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: milano-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: milano-db
          property: password
      - key: DB_DATABASE
        fromDatabase:
          name: milano-db
          property: database

  # 2. REACT FRONTEND
  - type: static      # Zurück zu static
    name: milano-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist  # Das richtige Feld für 'type: static' ist publishDir
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: milano-backend
          property: url

# 3. POSTGRESQL DATENBANK
databases:
  - name: milano-db
    plan: free